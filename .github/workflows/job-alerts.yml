name: job-alerts

on:
  schedule:
    - cron: "17,47 * * * *"  # every 30 min, off the busy :00/:30 slots GitHub tends to delay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python job_alerts.py
        env:
          # Each feed in config.json names the secret holding its Discord webhook; any name works.
          REPO_SECRETS: ${{ toJSON(secrets) }}
          # Seen jobs are stored per repo owner, so copies of this repo start with a clean history.
          SEEN_DB: seen/${{ github.repository_owner }}.db

      - name: Commit seen jobs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add seen/
          git diff --cached --quiet || { git commit -m "Update seen jobs [skip ci]" && git push; }
